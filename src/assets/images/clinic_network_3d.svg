<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#F8FAFC"/>
      <stop offset="100%" stopColor="#EFF6FF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Connectors -->
  <line x1="120" y1="200" x2="300" y2="200" stroke="#0E7C86" stroke-width="6" stroke-dasharray="8 6"/>
  <line x1="300" y1="200" x2="480" y2="200" stroke="#1769AA" stroke-width="6" stroke-dasharray="8 6"/>
  
  <!-- Node 1: Village PHC -->
  <g transform="translate(60, 130)">
    <rect width="120" height="140" rx="16" fill="#FFFFFF" stroke="#059669" stroke-width="4"/>
    <rect x="20" y="20" width="80" height="24" rx="6" fill="#ECFDF5"/>
    <text x="60" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#065F46">VILLAGE</text>
    <circle cx="60" cy="80" r="22" fill="#D1FAE5"/>
    <path d="M60 68 V92 M48 80 H72" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
    <text x="60" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1E293B">Kothapalli PHC</text>
  </g>

  <!-- Node 2: Mandal Centre -->
  <g transform="translate(240, 115)">
    <rect width="120" height="170" rx="16" fill="#FFFFFF" stroke="#0284C7" stroke-width="4"/>
    <rect x="15" y="20" width="90" height="24" rx="6" fill="#E0F2FE"/>
    <text x="60" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#075985">MANDAL CHC</text>
    <circle cx="60" cy="90" r="26" fill="#BAE6FD"/>
    <path d="M60 76 V104 M46 90 H74" stroke="#0284C7" stroke-width="5" stroke-linecap="round"/>
    <text x="60" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1E293B">Ibrahimpatnam</text>
  </g>

  <!-- Node 3: District Hospital -->
  <g transform="translate(420, 100)">
    <rect width="130" height="200" rx="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/>
    <rect x="15" y="20" width="100" height="24" rx="6" fill="#F3E8FF"/>
    <text x="65" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#5B21B6">DISTRICT</text>
    <circle cx="65" cy="100" r="30" fill="#DDD6FE"/>
    <path d="M65 84 V116 M49 100 H81" stroke="#7C3AED" stroke-width="6" stroke-linecap="round"/>
    <text x="65" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#1E293B">District Hospital</text>
  </g>
</svg>
